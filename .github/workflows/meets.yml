name: meets

on:
  schedule:
    # Daily at 18:17 UTC (early morning in Australia)
    - cron: "17 18 * * *"
  workflow_dispatch:

jobs:
  meets:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the latest version of `uv`
        uses: astral-sh/setup-uv@v5

      - name: Test
        run: uv run pytest -q steps/test_meets.py

      - name: Land meets in S3
        run: uv run python steps/meets.py
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

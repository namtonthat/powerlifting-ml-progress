name: Build meets dashboard image

# Code/deps-only triggers: the page reads fresh meets data from S3 at query time.
on:
  push:
    branches: [main]
    paths:
      - "pages/05_*"
      - "steps/conf.py"
      - "meets.Dockerfile*"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-meets-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: meets-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/namtonthat/powerlifting-meets-dashboard

jobs:
  build:
    # Native arm64 (free for public repos) to match the Apple Silicon mac mini.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: docker build -f meets.Dockerfile -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .

      - name: Smoke test
        run: |
          # Health alone passes even if the page crashes, so run the page once in bare mode too.
          docker run --rm "$IMAGE:latest" python "pages/05_📅_meets.py"
          docker run -d --name smoke -p 8501:8501 "$IMAGE:latest"
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health > /dev/null; then ok=1; break; fi
            sleep 2
          done
          docker logs smoke
          [ "$ok" = "1" ]

      - name: Push
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
